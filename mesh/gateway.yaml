# Gateway: which ports the ingress gateway Envoy listens on, and for which
# hosts. It says nothing about where traffic goes -- that is the
# VirtualService below, which binds to this Gateway by name.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: mesh-gateway
  namespace: mesh-demo
spec:
  # Matches the label the istio/gateway Helm chart puts on its pods when the
  # release is named "istio-ingress".
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
# VirtualService: L7 routing. This one is bound to the Gateway, so it applies
# to traffic arriving from outside. The same kind of resource without a
# `gateways` field would apply to in-mesh calls between sidecars.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ingress-routes
  namespace: mesh-demo
spec:
  hosts:
    - "*"
  gateways:
    - mesh-gateway
  http:
    - match:
        - uri:
            prefix: /hello
      route:
        - destination:
            host: helloworld
            subset: v1
          weight: 90
        - destination:
            host: helloworld
            subset: v2
          weight: 10
    - match:
        - uri:
            prefix: /httpbin/
      rewrite:
        uri: /
      route:
        - destination:
            host: httpbin
            port:
              number: 8000
