# Helm values for prometheus-community/prometheus.
#
# Every Envoy in the mesh already counts what it does: requests by source,
# destination, version and response code (istio_requests_total), latency
# histograms, bytes. Istio also annotates every injected pod with
# prometheus.io/scrape, /port (15020) and /path (/stats/prometheus). The
# chart's default `kubernetes-pods` job honours those annotations, so there
# is nothing Istio-specific to configure here: Prometheus finds the sidecars,
# the ingress gateway and istiod on its own.
#
# Port 15020 is excluded from mTLS, which is why a Prometheus with no sidecar
# can scrape pods in a STRICT mesh.

server:
  global:
    # The chart default is 1m. A lab wants a click on the traffic console to
    # show within seconds; at this size a 5s scrape costs nothing. Production
    # meshes use 15-30s.
    scrape_interval: 5s
    evaluation_interval: 5s

  # A lab does not need its metrics to survive a restart, and the local k3s
  # cluster has no storage worth keeping.
  persistentVolume:
    enabled: false
  retention: 6h

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Only the Prometheus server. The rest of the chart is a general-purpose
# cluster monitoring stack that has nothing to do with the mesh.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
